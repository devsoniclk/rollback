[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rollback-engine"
version = "0.3.0"
description = "Transactional filesystem & state rollback engine for autonomous AI coding agents"
readme = "README.md"
authors = [{ name = "Lakshitha Dananjaya", email = "lakshitha.dananjaya.org@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["ai-agents", "rollback", "checkpoints", "transactional", "diff", "coding-agents", "safety", "llm-tools", "asyncio"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
rollback = "rollback.cli:main"

[project.urls]
Homepage = "https://github.com/devsoniclk/rollback"
Repository = "https://github.com/devsoniclk/rollback.git"
Issues = "https://github.com/devsoniclk/rollback/issues"
